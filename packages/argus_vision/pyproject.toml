[build-system]
requires = ["setuptools==80.10.2", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "argus-vision"
version = "0.2.0"
description = "Shared vision pipeline for Argus: OpenVINO detection, tracking, ROI, geometry, sources."
requires-python = ">=3.11"
dependencies = [
  "argus-common",
  "numpy==1.26.4",
  "opencv-python-headless==4.9.0.80",
  "openvino==2024.6.0",
  "pydantic-settings==2.16.2",
  # deep-sort-realtime imports pkg_resources, retained by this setuptools line.
  "setuptools==80.10.2",
  "deep-sort-realtime==1.3.2",
  "scipy==1.17.1",
  # IANA zone data for zoneinfo where the OS has none (Windows, minimal images).
  "tzdata==2026.6",
]

[tool.setuptools.packages.find]
include = ["argus_vision*"]
