[build-system]
requires = ["setuptools==80.9.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "argus-common"
version = "0.2.0"
description = "Security and service-to-service primitives shared by Argus services."
requires-python = ">=3.11"
dependencies = [
  "cryptography>=44.0.0",
  "pyjwt[crypto]==2.10.1",
  "fastapi==0.109.2",
  "httpx==0.26.0",
  "pydantic==2.6.1",
  "pydantic-settings==2.1.0",
  "sqlalchemy==2.0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0,<9.0.0",
  "pytest-asyncio==1.4.0",
  "aiosqlite==0.19.0",
]

[tool.setuptools.packages.find]
include = ["argus_common*"]
