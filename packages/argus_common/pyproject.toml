[build-system]
requires = ["setuptools==80.10.2", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "argus-common"
version = "0.2.0"
description = "Security and service-to-service primitives shared by Argus services."
requires-python = ">=3.11"
dependencies = [
  "cryptography>=44.0.0",
  "pyjwt[crypto]==2.15.1",
  "fastapi==0.162.2",
  "httpx==0.28.1",
  "pydantic==2.14.3",
  "pydantic-settings==2.16.2",
  "sqlalchemy==2.1.8",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3,<10.0.0",
  "pytest-asyncio==1.4.1.post1",
  "aiosqlite==0.22.1",
]

[tool.setuptools.packages.find]
include = ["argus_common*"]
