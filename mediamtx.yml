# MediaMTX — RTSP ingest and WebRTC playback.
#
# Passwords below are placeholders replaced by environment variables in the
# compose files (MTX_AUTHINTERNALUSERS_<n>_PASS); the stack refuses to start
# without them. MediaMTX >= 1.21 is required: 1.9 silently ignored these
# overrides, leaving the placeholders as the real passwords.

api: yes
apiAddress: :9997
metrics: no

rtspAddress: :8554
# Relays and analytics use RTSP over TCP (the only RTSP port published).
rtspTransports: [tcp]
webrtc: yes
webrtcAddress: :8889
# Only what the dashboard needs.
rtmp: no
hls: no
srt: no
moq: no

authInternalUsers:
  # 0: backend stream registration (control API).
  - user: mtx_api
    pass: replaced-by-env
    permissions:
      - action: api
  # 1: camera relays publishing into MediaMTX (see scripts/relay-cam1.ps1).
  - user: mtx_publisher
    pass: replaced-by-env
    permissions:
      - action: publish
  # 2: analytics reading the ingested path (single ingest).
  - user: mtx_reader
    pass: replaced-by-env
    permissions:
      - action: read
  # 3: the edge proxies, relaying browsers' WebRTC playback after the owning
  # service authorised the user for that camera. Nobody reads anonymously:
  # not over WebRTC, not over the published RTSP port.
  - user: mtx_viewer
    pass: replaced-by-env
    permissions:
      - action: read

paths:
  all_others:
