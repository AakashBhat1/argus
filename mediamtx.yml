# MediaMTX — RTSP ingest and WebRTC playback.
#
# Passwords below are placeholders overridden by environment variables in
# the compose files (MTX_AUTHINTERNALUSERS_<n>_PASS); the stack refuses to
# start without them.

api: yes
apiAddress: :9997
metrics: no

rtspAddress: :8554
webrtc: yes
webrtcAddress: :8889
# Only what the dashboard needs.
rtmp: no
hls: no
srt: no

authInternalUsers:
  # 0: backend stream registration (control API).
  - user: mtx_api
    pass: replaced-by-env
    permissions:
      - action: api
  # 1: camera relays publishing into MediaMTX (see scripts/relay-cam1.ps1).
  - user: mtx_publisher
    pass: replaced-by-env
    permissions:
      - action: publish
  # 2: analytics reading the ingested path (single ingest).
  - user: mtx_reader
    pass: replaced-by-env
    permissions:
      - action: read
  # Browser WebRTC playback. The public gateway only exposes WHEP under
  # /stream/, behind the dashboard; restrict further per deployment.
  - user: any
    permissions:
      - action: read
        path: ""

paths:
  all_others:
