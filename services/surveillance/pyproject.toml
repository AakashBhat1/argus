[build-system]
requires = ["setuptools==80.10.2", "wheel"]
build-backend = "setuptools.build_meta"

# An application, not a library: installing this project installs its
# dependencies; the code runs from this directory (uvicorn app.main:app).
[project]
name = "argus-surveillance"
version = "0.2.0"
description = "Argus surveillance service: detection, risk engine, security console, auth."
requires-python = ">=3.11"
dependencies = [
  "argus-common",
  "argus-vision",
  "fastapi==0.162.2",
  "uvicorn[standard]==0.54.0",
  "sqlalchemy==2.1.8",
  "aiosqlite==0.22.1",
  "asyncpg==0.32.0",
  "psycopg2-binary==2.9.13",
  "alembic==1.20.1",
  "pydantic==2.14.3",
  "pydantic-settings==2.16.2",
  "python-multipart==0.0.33",
  "websockets==12.0",
  "httpx==0.28.1",
  "pyyaml==6.0.3",
  "torch==2.15.0",
  "torchvision==0.29.2",
  "Pillow==13.0.0",
  "python-dotenv==1.2.4",
  "aiofiles==23.2.1",
  "huggingface-hub>=0.20.0",
  "transformers>=4.40.0",
  "passlib[bcrypt]==1.7.4",
  "bcrypt==4.0.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3,<10.0.0",
  "pytest-asyncio==1.4.1.post1",
]

[tool.setuptools]
packages = []
