[build-system]
requires = ["setuptools==80.10.2", "wheel"]
build-backend = "setuptools.build_meta"

# An application, not a library: installing this project installs its
# dependencies; the code runs from this directory (uvicorn app.main:app).
[project]
name = "argus-parking"
version = "0.2.0"
description = "Argus parking service: gate plate OCR, bay occupancy, sessions, ParkBot."
requires-python = ">=3.11"
dependencies = [
  "argus-common",
  "argus-vision",
  "fastapi==0.162.2",
  "uvicorn[standard]==0.54.0",
  "sqlalchemy==2.1.8",
  "aiosqlite==0.22.1",
  "asyncpg==0.32.0",
  "alembic==1.20.1",
  "pydantic==2.14.3",
  "pydantic-settings==2.16.2",
  "websockets==12.0",
  "httpx==0.28.1",
  "python-dotenv==1.2.4",
  # IANA zone data for zoneinfo where the OS has none (Windows, minimal images).
  "tzdata==2026.6",
  # deep-sort's default appearance embedder
  "torch==2.15.0",
  "torchvision==0.29.2",
  # Gate plate OCR
  "rapidocr-onnxruntime==1.4.4",
  "onnxruntime==1.31.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3,<10.0.0",
  "pytest-asyncio==1.4.1.post1",
]

[tool.setuptools]
packages = []
