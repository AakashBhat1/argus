[build-system]
requires = ["setuptools==80.9.0", "wheel"]
build-backend = "setuptools.build_meta"

# An application, not a library: installing this project installs its
# dependencies; the code runs from this directory (uvicorn app.main:app).
[project]
name = "argus-parking"
version = "0.2.0"
description = "Argus parking service: gate plate OCR, bay occupancy, sessions, ParkBot."
requires-python = ">=3.11"
dependencies = [
  "argus-common",
  "argus-vision",
  "fastapi==0.162.2",
  "uvicorn[standard]==0.27.1",
  "sqlalchemy==2.0.27",
  "aiosqlite==0.19.0",
  "asyncpg==0.29.0",
  "alembic==1.13.1",
  "pydantic==2.14.3",
  "pydantic-settings==2.1.0",
  "websockets==12.0",
  "httpx==0.26.0",
  "python-dotenv==1.2.4",
  # IANA zone data for zoneinfo where the OS has none (Windows, minimal images).
  "tzdata==2026.6",
  # deep-sort's default appearance embedder
  "torch==2.14.1",
  "torchvision==0.29.1",
  # Gate plate OCR
  "rapidocr-onnxruntime==1.3.24",
  "onnxruntime==1.17.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3,<10.0.0",
  "pytest-asyncio==1.4.1.post1",
]

[tool.setuptools]
packages = []
