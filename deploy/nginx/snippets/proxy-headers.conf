proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
# Never let a browser supply mesh identity headers; only internal listeners
# set them, from the verified client certificate.
proxy_set_header X-Argus-Client-Verified "";
proxy_set_header X-Argus-Client-Service "";
proxy_set_header X-Argus-Service-Token "";
