# $http_host keeps the port the browser used; the apps compare it with
# Origin for their same-origin (CSRF / WebSocket) checks.
proxy_set_header Host $http_host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
# Never let a browser supply mesh identity headers; only internal listeners
# set them, from the verified client certificate.
proxy_set_header X-Argus-Client-Verified "";
proxy_set_header X-Argus-Client-Service "";
proxy_set_header X-Argus-Service-Token "";
