# Forward the verified client identity to the service. The service also
# requires a scoped service token whose issuer matches this common name.
proxy_set_header Host $http_host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Argus-Client-Verified $ssl_client_verify;
proxy_set_header X-Argus-Client-Service $argus_client_cn;
