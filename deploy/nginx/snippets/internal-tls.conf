# Mutual TLS for internal listeners: only certificates issued by the Argus
# private CA (deploy/pki.sh) can connect at all.
ssl_protocols TLSv1.3;
ssl_client_certificate /run/secrets/argus/ca.pem;
ssl_verify_client on;
ssl_verify_depth 1;
ssl_session_cache shared:ArgusInternal:10m;
ssl_session_tickets off;
