# Argus edge proxy. Server blocks are rendered from templates/ into
# /etc/nginx/argus.d by the image entrypoint (NGINX_ENVSUBST_OUTPUT_DIR).
user nginx;
worker_processes auto;
pid /var/run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 4096;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    # No query strings in access logs (they could carry identifiers).
    log_format argus '$remote_addr - [$time_local] "$request_method $uri $server_protocol" '
                     '$status $body_bytes_sent $request_time "$http_user_agent" '
                     'client_cert=$ssl_client_verify';
    access_log /var/log/nginx/access.log argus;

    sendfile on;
    keepalive_timeout 65;
    client_body_timeout 15s;
    client_header_timeout 15s;
    send_timeout 30s;

    include /etc/nginx/argus.d/*.conf;
}
