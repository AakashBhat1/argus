# Argus monorepo root. Not a package: services and shared packages each have
# their own pyproject.toml.
#
#   packages/argus_common   security + service-to-service primitives
#   packages/argus_vision   shared detection/tracking/geometry pipeline
#   services/surveillance   cameras, risk engine, security console, auth
#
# Dev install (CPU torch wheels come from the PyTorch index):
#   pip install --extra-index-url https://download.pytorch.org/whl/cpu \
#     -e packages/argus_common -e packages/argus_vision \
#     -e "services/surveillance[dev]"

[tool.uv.workspace]
members = ["packages/*", "services/*"]

[tool.uv.sources]
argus-common = { workspace = true }
argus-vision = { workspace = true }
