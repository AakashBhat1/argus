name: Backend CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-migrations:
    runs-on: ubuntu-latest
    env:
      DEBUG: "true"
      SECRET_KEY: "ci-only-secret-key-that-is-at-least-32-characters"
      DATABASE_URL: "sqlite+aiosqlite:///./ci_migrations.db"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install backend and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --extra-index-url https://download.pytorch.org/whl/cpu -e ".[dev]"

      - name: Run backend tests
        run: python -m pytest

      - name: Verify Alembic upgrade and downgrade
        working-directory: backend/yolo_classifier
        run: |
          alembic upgrade head
          alembic downgrade base
